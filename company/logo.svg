<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">SQLite in Clojure: three rows of a table held in a pair of parentheses</title>
  <!-- the parentheses: the Lisp that holds the table -->
  <path d="M15 8 C5 18 5 46 15 56" fill="none" stroke="#1f2328" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M15 8 C5 18 5 46 15 56" fill="none" stroke="#c9a46a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M49 8 C59 18 59 46 49 56" fill="none" stroke="#1f2328" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M49 8 C59 18 59 46 49 56" fill="none" stroke="#c9a46a" stroke-width="3.2" stroke-linecap="round"/>
  <!-- three rows, the middle one read (highlighted) -->
  <rect x="19" y="15" width="26" height="9" rx="2.5" fill="#d9f2e6" stroke="#1f2328" stroke-width="2.2"/>
  <rect x="19" y="27.5" width="26" height="9" rx="2.5" fill="#2fb38a" stroke="#1f2328" stroke-width="2.2"/>
  <rect x="19" y="40" width="26" height="9" rx="2.5" fill="#d9f2e6" stroke="#1f2328" stroke-width="2.2"/>
  <!-- the column lines -->
  <path d="M28 16 V23 M36 16 V23 M28 41 V48 M36 41 V48" stroke="#1f2328" stroke-width="1.6"/>
  <path d="M28 28.5 V35.5 M36 28.5 V35.5" stroke="#ffffff" stroke-width="1.6"/>
</svg>
